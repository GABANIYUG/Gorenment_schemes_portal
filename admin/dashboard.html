<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Welfare Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm" id="mainNavbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-bank me-2"></i>Welfare Portal <span class="badge bg-warning text-dark ms-2 small">ADMIN</span></a>
        <ul class="navbar-nav ms-auto" id="authNav"></ul>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 admin-sidebar px-0">
            <h6 class="px-3 pt-3 text-uppercase text-muted fw-bold mb-2 small">Admin Menu</h6>
            <nav class="nav flex-column">
                <a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                <a class="nav-link" href="schemes.html"><i class="bi bi-card-list me-2"></i>Manage Schemes</a>
                <a class="nav-link" href="add-scheme.html"><i class="bi bi-plus-circle me-2"></i>Add Scheme</a>
                <a class="nav-link" href="users.html"><i class="bi bi-people me-2"></i>Manage Users</a>
                <a class="nav-link" href="messages.html"><i class="bi bi-envelope me-2"></i>Messages</a>
            </nav>
        </div>

        <!-- Main -->
        <div class="col-md-9 col-lg-10 p-4">
            <h2 class="fw-bold mb-4">Dashboard Overview</h2>
            <div class="row g-4 mb-5" id="statsCards">
                <div class="col-12 text-center py-3"><div class="spinner-border text-primary"></div></div>
            </div>

            <div class="row g-4" id="recentTables">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
checkAuth(function(user) {
    if (!user || user.role !== 'admin') { window.location.href = '../login.html'; return; }
    renderNavbar(user);

    fetch('../api.php?action=admin_stats')
        .then(r => r.json())
        .then(data => {
            if (!data.success) return;
            const s = data.stats;

            document.getElementById('statsCards').innerHTML = `
                <div class="col-md-3">
                    <div class="card stat-card shadow-sm bg-primary text-white">
                        <div class="card-body position-relative py-4">
                            <h6 class="text-uppercase mb-2 opacity-75">Total Citizens</h6>
                            <h2 class="display-5 fw-bold">${s.total_users}</h2>
                            <i class="bi bi-people-fill position-absolute bottom-0 end-0 m-3 opacity-25" style="font-size:3rem;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card shadow-sm bg-success text-white">
                        <div class="card-body position-relative py-4">
                            <h6 class="text-uppercase mb-2 opacity-75">Active Schemes</h6>
                            <h2 class="display-5 fw-bold">${s.active_schemes}</h2>
                            <i class="bi bi-check-circle-fill position-absolute bottom-0 end-0 m-3 opacity-25" style="font-size:3rem;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card shadow-sm bg-info text-white">
                        <div class="card-body position-relative py-4">
                            <h6 class="text-uppercase mb-2 opacity-75">Total Schemes</h6>
                            <h2 class="display-5 fw-bold">${s.total_schemes}</h2>
                            <i class="bi bi-card-list position-absolute bottom-0 end-0 m-3 opacity-25" style="font-size:3rem;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card shadow-sm bg-warning text-dark">
                        <div class="card-body position-relative py-4">
                            <h6 class="text-uppercase mb-2 opacity-75">Messages</h6>
                            <h2 class="display-5 fw-bold">${s.total_messages}</h2>
                            <i class="bi bi-envelope-fill position-absolute bottom-0 end-0 m-3 opacity-25" style="font-size:3rem;"></i>
                        </div>
                    </div>
                </div>`;

            document.getElementById('recentTables').innerHTML = `
                <div class="col-md-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold">Recent Schemes</h5>
                            <a href="schemes.html" class="btn btn-sm btn-outline-primary">View All</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light"><tr><th>Name</th><th>Category</th><th>Status</th></tr></thead>
                                <tbody>${s.recent_schemes.map(r => `<tr>
                                    <td class="fw-bold text-primary">${escHtml(r.scheme_name)}</td>
                                    <td><span class="badge bg-light text-dark border">${escHtml(r.category)}</span></td>
                                    <td><span class="badge bg-${r.status === 'active' ? 'success' : 'danger'}">${r.status}</span></td>
                                </tr>`).join('')}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold">Recent Users</h5>
                            <a href="users.html" class="btn btn-sm btn-outline-primary">View All</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light"><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead>
                                <tbody>${s.recent_users.map(r => `<tr>
                                    <td class="fw-bold">${escHtml(r.name)}</td>
                                    <td class="text-muted small">${escHtml(r.email)}</td>
                                    <td class="small">${new Date(r.created_at).toLocaleDateString('en-IN')}</td>
                                </tr>`).join('')}</tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
        });
});
</script>
</body>
</html>
