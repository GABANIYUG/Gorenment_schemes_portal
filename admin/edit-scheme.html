<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Scheme - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-bank me-2"></i>Welfare Portal <span class="badge bg-warning text-dark ms-2 small">ADMIN</span></a>
        <ul class="navbar-nav ms-auto" id="authNav"></ul>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 admin-sidebar px-0">
            <h6 class="px-3 pt-3 text-uppercase text-muted fw-bold mb-2 small">Admin Menu</h6>
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                <a class="nav-link active" href="schemes.html"><i class="bi bi-card-list me-2"></i>Manage Schemes</a>
                <a class="nav-link" href="add-scheme.html"><i class="bi bi-plus-circle me-2"></i>Add Scheme</a>
                <a class="nav-link" href="users.html"><i class="bi bi-people me-2"></i>Manage Users</a>
                <a class="nav-link" href="messages.html"><i class="bi bi-envelope me-2"></i>Messages</a>
            </nav>
        </div>
        <div class="col-md-9 col-lg-10 p-4" id="mainContent">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
checkAuth(function(user) {
    if (!user || user.role !== 'admin') { window.location.href = '../login.html'; return; }
    renderNavbar(user);

    const id = getUrlParam('id');
    if (!id) { window.location.href = 'schemes.html'; return; }

    // Fetch existing scheme data via AJAX
    fetch('../api.php?action=admin_scheme_get&id=' + id)
        .then(r => r.json())
        .then(data => {
            if (!data.success) { window.location.href = 'schemes.html'; return; }
            const s = data.scheme;
            const imgPreview = s.image ? `<div class="mb-2"><img src="${escHtml(s.image)}" style="max-height:80px;border-radius:6px;" alt="current"></div>` : '';

            document.getElementById('mainContent').innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold">Edit Scheme</h2>
                    <a href="schemes.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Back</a>
                </div>
                ${new URLSearchParams(window.location.search).get('error') ? `<div class="alert alert-danger">Required fields are missing. Please fill all mandatory fields.</div>` : ''}
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form action="../api.php?action=admin_scheme_save" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                            <input type="hidden" name="mode" value="edit">
                            <input type="hidden" name="id" value="${s.id}">
                            <input type="hidden" name="existing_image" value="${escHtml(s.image || '')}">

                            <h5 class="text-primary border-bottom pb-2 mb-3">Basic Information</h5>
                            <div class="row mb-3">
                                <div class="col-md-6 mb-3"><label class="form-label">Scheme Name *</label><input type="text" class="form-control" name="scheme_name" value="${escHtml(s.scheme_name)}" required></div>
                                <div class="col-md-3 mb-3"><label class="form-label">Category *</label><input type="text" class="form-control" name="category" value="${escHtml(s.category)}" required></div>
                                <div class="col-md-3 mb-3"><label class="form-label">State</label><input type="text" class="form-control" name="state" value="${escHtml(s.state || 'All India')}"></div>
                                <div class="col-12 mb-3"><label class="form-label">Keywords</label><input type="text" class="form-control" name="keywords" value="${escHtml(s.keywords || '')}"></div>
                                <div class="col-12 mb-3"><label class="form-label">Short Description *</label><textarea class="form-control" name="short_description" rows="2" required>${escHtml(s.short_description)}</textarea></div>
                                <div class="col-12 mb-3"><label class="form-label">Full Description *</label><textarea class="form-control" name="description" rows="5" required>${escHtml(s.description)}</textarea></div>
                            </div>
                            <h5 class="text-primary border-bottom pb-2 mb-3 mt-4">Eligibility & Benefits</h5>
                            <div class="row mb-3">
                                <div class="col-md-6 mb-3"><label class="form-label">Who Can Apply</label><textarea class="form-control" name="who_can_apply" rows="3">${escHtml(s.who_can_apply || '')}</textarea></div>
                                <div class="col-md-6 mb-3"><label class="form-label">Benefits</label><textarea class="form-control" name="benefits" rows="3">${escHtml(s.benefits || '')}</textarea></div>
                                <div class="col-12 mb-3"><label class="form-label">Eligibility Criteria</label><textarea class="form-control" name="eligibility" rows="3">${escHtml(s.eligibility || '')}</textarea></div>
                            </div>
                            <h5 class="text-primary border-bottom pb-2 mb-3 mt-4">Application Details</h5>
                            <div class="row mb-3">
                                <div class="col-md-6 mb-3"><label class="form-label">Documents Required</label><textarea class="form-control" name="documents_required" rows="4">${escHtml(s.documents_required || '')}</textarea></div>
                                <div class="col-md-6 mb-3"><label class="form-label">How to Apply</label><textarea class="form-control" name="how_to_apply" rows="4">${escHtml(s.how_to_apply || '')}</textarea></div>
                                <div class="col-12 mb-3"><label class="form-label">Official Link</label><input type="url" class="form-control" name="official_application_link" value="${escHtml(s.official_application_link || '')}"></div>
                            </div>
                            <h5 class="text-primary border-bottom pb-2 mb-3 mt-4">Media & Status</h5>
                            <div class="row mb-3">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Update Image</label>
                                    ${imgPreview}
                                    <input type="file" class="form-control" name="image" accept=".jpg,.jpeg,.png,.webp">
                                    <div class="form-text">Leave blank to keep existing image.</div>
                                </div>
                                <div class="col-md-6 mb-3"><label class="form-label">Status</label>
                                    <select class="form-select" name="status">
                                        <option value="active" ${s.status === 'active' ? 'selected' : ''}>Active</option>
                                        <option value="inactive" ${s.status === 'inactive' ? 'selected' : ''}>Inactive</option>
                                    </select>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="schemes.html" class="btn btn-light">Cancel</a>
                                <button type="submit" class="btn btn-primary px-5">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>`;

            document.querySelector('form').addEventListener('submit', function(e) {
                if (!this.checkValidity()) { e.preventDefault(); e.stopPropagation(); }
                this.classList.add('was-validated');
            });
        });
});
</script>
</body>
</html>
