<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheme Details - Welfare Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-bank me-2"></i>Welfare Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="schemes.html">Schemes</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
            <ul class="navbar-nav" id="authNav"></ul>
        </div>
    </div>
</nav>

<div class="container my-5" id="pageContent">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
</div>

<footer class="bg-dark text-light py-4 mt-auto">
    <div class="container text-center">
        <p class="mb-0 text-muted">&copy; <span id="year"></span> Government Welfare Portal.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
checkAuth(function(user) { renderNavbar(user); });

const id = getUrlParam('id');
if (!id) {
    document.getElementById('pageContent').innerHTML = `<div class="alert alert-danger text-center"><h4>Invalid request</h4><a href="schemes.html" class="btn btn-primary mt-3">Back to Schemes</a></div>`;
} else {
    fetch('api.php?action=schemes_get&id=' + id)
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                const s = data.scheme;
                document.title = s.scheme_name + ' - Welfare Portal';

                const imgHtml = s.image
                    ? `<img src="${escHtml(s.image)}" class="card-img-top" alt="${escHtml(s.scheme_name)}" style="max-height:420px;object-fit:cover;">`
                    : '';

                const applyBtn = s.official_application_link
                    ? `<a href="${escHtml(s.official_application_link)}" target="_blank" rel="noopener noreferrer" class="btn btn-success btn-lg w-100 shadow-sm"><i class="bi bi-box-arrow-up-right me-2"></i>Apply on Official Website</a>`
                    : `<button class="btn btn-secondary btn-lg w-100" disabled>Official Link Unavailable</button>`;

                function section(icon, title, content) {
                    if (!content) return '';
                    return `<h4 class="fw-bold text-primary border-bottom pb-2 mb-3"><i class="bi ${icon} me-2"></i>${title}</h4>
                            <div class="mb-5 content-text">${content.replace(/\n/g,'<br>')}</div>`;
                }

                document.getElementById('pageContent').innerHTML = `
                    <nav aria-label="breadcrumb" class="mb-4">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                            <li class="breadcrumb-item"><a href="schemes.html">Schemes</a></li>
                            <li class="breadcrumb-item active">${escHtml(s.scheme_name)}</li>
                        </ol>
                    </nav>
                    <div class="row">
                        <div class="col-lg-8">
                            <div class="card shadow-sm border-0 mb-4">
                                ${imgHtml}
                                <div class="card-body p-4 p-md-5">
                                    <div class="d-flex flex-wrap gap-2 mb-3">
                                        <span class="badge badge-category fs-6 px-3 py-2">${escHtml(s.category)}</span>
                                        <span class="badge bg-secondary fs-6 px-3 py-2"><i class="bi bi-geo-alt me-1"></i>${escHtml(s.state)}</span>
                                    </div>
                                    <h1 class="fw-bold text-primary mb-3">${escHtml(s.scheme_name)}</h1>
                                    <p class="lead text-muted mb-5">${escHtml(s.short_description)}</p>
                                    ${section('bi-info-circle','Overview', s.description)}
                                    <div class="row bg-light rounded p-4 mb-5">
                                        <div class="col-md-6 mb-3 mb-md-0">
                                            ${section('bi-person-check','Who Can Apply?', s.who_can_apply)}
                                        </div>
                                        <div class="col-md-6">
                                            ${section('bi-gift','Benefits', s.benefits)}
                                        </div>
                                    </div>
                                    ${section('bi-list-check','Eligibility Criteria', s.eligibility)}
                                    ${section('bi-file-earmark-text','Required Documents', s.documents_required)}
                                    ${section('bi-signpost','How to Apply', s.how_to_apply)}
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="card shadow-sm border-0 sticky-top text-center p-4" style="top:80px;">
                                <div class="text-primary mb-3"><i class="bi bi-shield-check" style="font-size:4rem;"></i></div>
                                <h5 class="fw-bold mb-2">Ready to Apply?</h5>
                                <p class="text-muted mb-4">Visit the official government portal to submit your application.</p>
                                ${applyBtn}
                                <hr class="my-4">
                                <p class="mb-0 text-muted small"><i class="bi bi-calendar3 me-1"></i>Added: ${new Date(s.created_at).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'})}</p>
                            </div>
                        </div>
                    </div>`;
            } else {
                document.getElementById('pageContent').innerHTML = `<div class="alert alert-danger text-center"><h4>${data.message || 'Scheme not found'}</h4><a href="schemes.html" class="btn btn-primary mt-3">Back to Schemes</a></div>`;
            }
        });
}
</script>
</body>
</html>
